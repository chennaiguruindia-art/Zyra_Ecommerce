apiVersion: apps/v1
kind: Deployment
metadata:
  name: zyra-web
  namespace: zyra-production
  labels:
    app: zyra-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: zyra-web
  template:
    metadata:
      labels:
        app: zyra-web
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: nginx-conf
        configMap:
          name: zyra-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: zyra-web-service
  namespace: zyra-production
  labels:
    app: zyra-web
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: zyra-web
