apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zyra-ingress
  namespace: zyra-production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - zyralifestyle.in
    - www.zyralifestyle.in
    - api.zyralifestyle.in
    secretName: zyra-tls-cert
  rules:
  - host: zyralifestyle.in
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: zyra-web-service
            port:
              number: 80
  - host: www.zyralifestyle.in
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: zyra-web-service
            port:
              number: 80
  - host: api.zyralifestyle.in
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: zyra-web-service
            port:
              number: 80
