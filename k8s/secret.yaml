apiVersion: v1
kind: Secret
metadata:
  name: zyra-secrets
  namespace: zyra-production
type: Opaque
stringData:
  # Sensitive production environment variables
  APP_KEY: "base64:YOUR_APP_KEY_HERE"
  DB_USERNAME: "zyra_user"
  DB_PASSWORD: "CHANGE_THIS_PRODUCTION_PASSWORD"
  REDIS_PASSWORD: ""
  RAZORPAY_KEY_ID: ""
  RAZORPAY_KEY_SECRET: ""
  RAZORPAY_WEBHOOK_SECRET: ""
  SHIPROCKET_EMAIL: ""
  SHIPROCKET_PASSWORD: ""
