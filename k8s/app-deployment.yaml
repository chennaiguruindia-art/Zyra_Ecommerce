apiVersion: apps/v1
kind: Deployment
metadata:
  name: zyra-app
  namespace: zyra-production
  labels:
    app: zyra-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: zyra-app
  template:
    metadata:
      labels:
        app: zyra-app
    spec:
      containers:
      - name: php-fpm
        image: zyralifestyle/app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9000
        envFrom:
        - configMapRef:
            name: zyra-config
        - secretRef:
            name: zyra-secrets
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        readinessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: zyra-app-service
  namespace: zyra-production
  labels:
    app: zyra-app
spec:
  type: ClusterIP
  ports:
  - port: 9000
    targetPort: 9000
  selector:
    app: zyra-app
