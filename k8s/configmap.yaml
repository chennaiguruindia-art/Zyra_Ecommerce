apiVersion: v1
kind: ConfigMap
metadata:
  name: zyra-config
  namespace: zyra-production
data:
  APP_NAME: "ZYRA"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "https://zyralifestyle.in"
  
  # Database Host via Kubernetes Internal Service Discovery
  DB_CONNECTION: "mysql"
  DB_HOST: "mysql-service.zyra-production.svc.cluster.local"
  DB_PORT: "3306"
  DB_DATABASE: "ecommerce1"

  # High-Speed Redis Cluster via Kubernetes Service Discovery
  CACHE_STORE: "redis"
  SESSION_DRIVER: "redis"
  QUEUE_CONNECTION: "redis"
  REDIS_HOST: "redis-service.zyra-production.svc.cluster.local"
  REDIS_PORT: "6379"

  # Performance Tuning
  OCTANE_SERVER: "roadrunner"
  LOG_CHANNEL: "stack"
  LOG_LEVEL: "warning"
