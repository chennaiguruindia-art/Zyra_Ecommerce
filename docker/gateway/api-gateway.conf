# ══════════════════════════════════════════════════════════════════
# ZYRA High-Performance API Gateway & Reverse Proxy Configuration
# Provides Load Balancing, Centralized Rate Limiting & SSL Termination
# ══════════════════════════════════════════════════════════════════

# 1. Upstream Backend Cluster (Load Balanced with Least Connections)
upstream zyra_app_cluster {
    least_conn;
    server app:9000 max_fails=3 fail_timeout=10s;
    # Can scale horizontally to multiple containers/pods:
    # server app-2:9000 max_fails=3 fail_timeout=10s;
    # server app-3:9000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 2. Rate Limiting Zones at Gateway Level
limit_req_zone $binary_remote_addr zone=zyra_api_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=zyra_web_limit:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=zyra_conn_limit:10m;

server {
    listen 80;
    listen [::]:80;
    server_name api.zyralifestyle.in zyralifestyle.in www.zyralifestyle.in;
    root /var/www/html/public;

    # Global Connection Limits per IP (Stops DDoS floods)
    limit_conn zyra_conn_limit 50;

    client_max_body_size 100M;
    charset utf-8;

    # 3. Global Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 4. API Gateway Route (/api/*)
    location /api/ {
        limit_req zone=zyra_api_limit burst=30 nodelay;

        # Cross-Origin Resource Sharing (CORS) for Mobile App & Web Frontend
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With, X-Device-ID' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        try_files $uri $uri/ /index.php?$query_string;
    }

    # 5. Web Routes & Storefront (100+ Concurrent Shoppers)
    location / {
        limit_req zone=zyra_web_limit burst=50 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 6. Static Asset Offload & Edge Caching
    location ~* \.(ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 7. PHP-FPM FastCGI Upstream Dispatcher
    location ~ \.php$ {
        fastcgi_pass zyra_app_cluster;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
        fastcgi_next_upstream error timeout invalid_header http_500 http_503;
    }

    # 8. Kubernetes / Gateway Health Check Endpoint
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
